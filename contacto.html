<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Diagnóstico - MateriaGris</title>
    <link rel="icon" type="image/png" href="logo-materiagris.png">
    <link rel="preload" as="image" href="logo-materiagris.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2a3a52;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --max-width: 1140px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header / Navbar */
        header {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

       /* Asegura que el logo y el texto se alienen horizontalmente y centrados */
.logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}

/* Estilo llamativo para el texto MateriaGris */
.brand-text {
    font-size: 1.8rem;
    font-weight: 800;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    letter-spacing: -0.5px;
    /* Degradado llamativo (puedes ajustar los colores según tu paleta) */
    background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
}

        .logo-container img {
            height: 56px;
            width: auto;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover, .nav-link.active { color: var(--accent); }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Contact Section */
        .contact-page {
            padding: 64px 0 96px;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .contact-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 640px;
            margin: 0 auto;
        }

        .contact-form-wrapper {
            max-width: 680px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        /* Form Grid Layout */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background-color: var(--bg-card-hover);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        textarea.form-control {
            min-height: 110px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
        }

        .form-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .form-status.success {
            display: block;
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        footer {
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .contact-form-wrapper { padding: 24px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

   <header>
    <div class="container nav-wrapper">
        <a href="index.html" class="logo-container">
            <img src="logo-materiagris.png" alt="MateriaGris" width="200" height="80" />
            <span class="brand-text">MateriaGris</span>
        </a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="beneficios.html" class="nav-link">Beneficios</a>
            <a href="stack.html" class="nav-link">Stack Tecnológico</a>
            <a href="servicios.html" class="nav-link">Servicios</a>
            <a href="contacto.html" class="nav-link active">Contacto</a>
        </nav>
    </div>
</header>

    <main class="contact-page">
        <div class="container">
            <div class="contact-header">
                <h1>Contacto y Diagnóstico</h1>
                <p>Coordinemos una evaluación técnica sobre la arquitectura de tu sistema actual y las opciones de migración.</p>
            </div>

            <div class="contact-form-wrapper">
                <form id="contact-form" action="https://formspree.io/f/mnpajgap" method="POST"></form>
                    <!-- Cambia el asunto del correo que recibís -->
<input type="hidden" name="_subject" value="Nuevo Diagnóstico Solicitado - MateriaGris">

<!-- Previene el spam de bots con un campo Honeypot -->
<input type="text" name="_gotcha" style="display:none">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="nombre">Nombre y Apellido *</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Daniel Gómez" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email Corporativo *</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="nombre@empresa.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="empresa">Empresa / Organización *</label>
                            <input type="text" id="empresa" name="empresa" class="form-control" placeholder="Nombre de tu empresa" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="telefono">Teléfono / WhatsApp *</label>
                            <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="+54 9 11 ..." required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="pais">País *</label>
                            <select id="pais" name="pais" class="form-control" required>
                                <option value="" disabled selected>Selecciona tu país...</option>
                                <option value="Argentina">Argentina</option>
                                <option value="Chile">Chile</option>
                                <option value="Colombia">Colombia</option>
                                <option value="España">España</option>
                                <option value="México">México</option>

                                <option value="Perú">Perú</option>
                                <option value="Uruguay">Uruguay</option>
                                <option value="Otro">Otro país</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sistema">Sistema Actual *</label>
                            <select id="sistema" name="sistema" class="form-control" required>
                                <option value="" disabled selected>Tipo de arquitectura...</option>
                                <option value="desktop-java">Desktop Java (Swing / JFrame)</option>
                                <option value="desktop-otro">Desktop en otra tecnología</option>
                                <option value="bd-solamente">Base de Datos local a conectar</option>
                                <option value="otro">Otro tipo de desarrollo custom</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="mensaje">Detalles de la Consulta (Opcional)</label>
                        <textarea id="mensaje" name="mensaje" class="form-control" placeholder="Contanos brevemente sobre los módulos a migrar o los objetivos de tu proyecto..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-submit">Solicitar Diagnóstico Sin Cargo</button>
                    <div id="form-status" class="form-status"></div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 MateriaGris. Todos los derechos reservados.</p>
        </div>
    </footer>
<script>
    const form = document.getElementById('contact-form');
const statusDiv = document.getElementById('form-status');

async function handleContactForm(event) {
    event.preventDefault();
    const data = new FormData(event.target);

    statusDiv.style.display = 'block';
    statusDiv.className = 'form-status';
    statusDiv.innerHTML = 'Enviando consulta...';

    try {
        const response = await fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        });

        if (response.ok) {
            statusDiv.className = 'form-status success';
            statusDiv.innerHTML = '✔ ¡Solicitud recibida correctamente! Nos pondremos en contacto a la brevedad.';
            form.reset();
        } else {
            const data = await response.json();
            if (Object.hasOwn(data, 'errors')) {
                statusDiv.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
                statusDiv.innerHTML = '❌ Ocurrió un problema al enviar el formulario. Inténtalo nuevamente.';
            }
        }
    } catch (error) {
        statusDiv.innerHTML = '❌ Error de conexión. Verificá tu red e intentalo más tarde.';
    }
}

form.addEventListener("submit", handleContactForm);
</script>
</body>
</html>
